# 环境变量 DCN_CONFIG 可指定其他 TOML 文件；相对路径以该文件目录为基准。
[model]
transport = "openai"
base_url = "http://10.137.16.118:8012/v1"
api_key_env = "OLLAMA_API_KEY"
model = "qwen3.6-rl"
timeout_seconds = 120
# 按部署模型服务端实际窗口（vLLM 的 max-model-len）填写；本地估算已按中文
# 字符加权（约 1 token/汉字）。窗口设得够大时，单轮排障不会中途触发压缩，
# 压缩只在多轮会话或超长结果累积时作为兜底生效。若服务端报上下文超限则调小。
context_window_tokens = 32768
max_output_tokens = 1536
safety_margin_tokens = 1024
compression_trigger_ratio = 0.80
summary_tokens = 1000
temperature = 0

[agent]
# 是否允许暂停本轮并请求用户补充信息；修改后重启服务。
allow_clarification = true
# 会话记忆隔离模式："session" 按 session_id 延续多轮历史（默认，前端多轮对话用）；
# "request" 每次请求都从全新上下文开始，不读取也不写回任何历史/摘要/技能/偏好
# （评测平台复用同一 session_id 跑多个 case 时用它保证 case 间零记忆；
#   消息与事件仍按会话存档，可事后回查）。
isolation = "session"
max_steps = 24
max_run_seconds = 600
# 决策 JSON 校验失败时的重试次数；仍失败只终止工具决策，不丢弃整轮。
decision_retries = 2
max_identical_calls = 3
tool_timeout_seconds = 60
# mcp.call/skill.run 结果进入上下文的预算（token）；超出部分存为 artifact，
# 模型用 artifact.search/read 分页读取（分页结果整页返回，不再二次截断）。
tool_result_tokens = 4000
max_input_chars = 12000
heartbeat_seconds = 10

[storage]
directory = "data"

[skills]
directory = "skills"
max_active = 3
# 进入系统提示词的技能指令预算（token）：读取同数量字符，中文恰好用满。
instruction_tokens = 4000
# skill.load 每页返回的 SKILL.md 字符数；未读完时模型按 next_offset 续读。
load_result_chars = 4000
# 直接在本机执行可信脚本，无需用户逐次确认；false 则禁止脚本执行。
allow_scripts = true
# 留空使用后端当前 Python；也可填写 Python 可执行文件路径，修改后重启。
# Windows 示例："C:/Miniconda/envs/agent/python.exe"；Linux 示例："/opt/conda/envs/agent/bin/python"
python_path = ""
script_timeout_seconds = 300

[prompts]
directory = "prompts"

[server]
host = "0.0.0.0"
port = 8520
# 可选：设置 DCN_API_TOKEN 环境变量，所有 /v1 接口要求 Bearer Token。
api_token_env = "DCN_API_TOKEN"

# 可配置多个 Streamable HTTP 服务。名称用于 mcp.call 的 server 参数。
# 未配置时可通过 MCP_SERVER_URL / MCP_API_TOKEN 环境变量接入名为 default 的服务。
# 显式配置默认放行该服务全部工具；需要白名单时再加 allowed_tools = ["工具名"]。
# [mcp.servers.dcn]
# url = "http://localhost:8000/mcp"
# token_env = "MCP_API_TOKEN"

[mcp]
# stdio 子进程 MCP 目录：其中每个 *.py 按文件名注册为同名服务
# （如 mcp/mcp_template.py → mcp.call 的 server "mcp_template"），无需再写配置。
# 脚本需用 FastMCP 等编写、以 stdio 传输运行（mcp.run()），依赖装在后端环境
# （见 requirements.txt）。每次调用启动一个脚本子进程会话，属 stdio 正常行为。
directory = "mcp"
# 启动 stdio 脚本的解释器；留空使用后端当前 Python。
python_path = ""

[frontend]
host = "0.0.0.0"
port = 8631
# 留空自动使用 server.host/port；前后端分机部署时填写后端地址。
backend_url = "http://0.0.0.0:8520"

# 前端拓扑只调用这里配置的三个查询工具，替换真实服务时修改名称即可。
[topology]
server = "mcp_template"
fabric_tool = "queryFabricList"
device_tool = "queryDeviceList"
topology_tool = "queryDeviceLink"
device_page_size = 1000
